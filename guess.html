<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whisper Draft — Guess</title>
    <meta name="description" content="Guess the hidden champion or the winning side in a real pro draft." />
    <link rel="preconnect" href="https://ddragon.leagueoflegends.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=32" />
  </head>
  <body class="guess-page">
    <div class="vignette"></div>
    <div id="boot" class="boot">
      <div class="boot-mark">W</div>
      <h1>Whisper Draft</h1>
      <p id="boot-status">Loading drafts…</p>
    </div>

    <div id="app" class="app guess-app" hidden>
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">W</span>
          <div>
            <strong>Whisper Draft</strong>
            <nav class="site-nav">
              <a href="index.html">Draft</a>
              <a href="tier.html">Tiers</a>
              <a href="guess.html" aria-current="page">Guess</a>
              <a href="meta.html">Meta</a>
              <a href="pro.html">Pro-Meta</a>
              <a href="matches.html">Matches</a>
              <a href="player.html">Players</a>
              <a href="team.html">Teams</a>
            </nav>
          </div>
        </div>
        <div class="phase-wrap">
          <p class="phase-kicker">Guess</p>
          <h2 id="guess-title" class="phase-title done">Who is missing?</h2>
        </div>
        <div class="top-actions">
          <span id="guess-score" class="game-label">0 correct</span>
        </div>
      </header>

      <main class="guess-main">
        <div id="guess-modes" class="chips" role="tablist" aria-label="Game mode"></div>
        <section id="guess-fearless" class="guess-fearless" hidden>
          <p class="phase-kicker">Already picked this series</p>
          <div id="guess-fearless-row" class="guess-fearless-row"></div>
        </section>
        <section class="board guess-draft">
          <section class="team team-blue" aria-label="Blue side">
            <header class="team-head">
              <strong id="guess-blue-name">Blue</strong>
              <span>Blue</span>
            </header>
            <div id="guess-blue-bans" class="bans"></div>
            <div id="guess-blue-picks" class="picks"></div>
          </section>
          <section class="match-mid guess-mid">
            <p id="guess-meta" class="result"></p>
            <p id="guess-time" class="guess-time" hidden></p>
            <p id="guess-hint" class="muted"></p>
            <p id="guess-feedback" class="guess-feedback"></p>
            <div id="guess-winner-actions" class="guess-winner-actions" hidden>
              <button type="button" id="guess-blue" class="guess-side-btn blue">Blue wins</button>
              <button type="button" id="guess-red" class="guess-side-btn red">Red wins</button>
            </div>
            <label id="guess-time-toggle" class="guess-time-toggle" hidden>
              <input id="guess-show-time" type="checkbox" />
              Show game time
            </label>
            <button id="guess-skip" type="button" class="guess-next">Skip</button>
          </section>
          <section class="team team-red" aria-label="Red side">
            <header class="team-head">
              <strong id="guess-red-name">Red</strong>
              <span>Red</span>
            </header>
            <div id="guess-red-bans" class="bans"></div>
            <div id="guess-red-picks" class="picks"></div>
          </section>
        </section>
        <section id="guess-pool" class="guess-pool" aria-label="Champion guesses">
          <div class="pool-tools">
            <input
              id="guess-search"
              type="search"
              placeholder="Search champions"
              autocomplete="off"
              spellcheck="false"
            />
            <div id="guess-roles" class="chips" role="tablist" aria-label="Positions"></div>
          </div>
          <div id="guess-grid" class="grid"></div>
        </section>
      </main>
    </div>

    <script src="champions.js"></script>
    <script src="winrates.js"></script>
    <script src="oracles.js"></script>
    <script src="player-ratings.js"></script>
    <script src="pro-games.js"></script>
    <script src="guess.js?v=3"></script>
  </body>
</html>
